<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay Coral — Shader Lab</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>◈ relay coral</h1><nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav></header>
<main><aside class="panel">
<section><h2 data-i="shader">Shader</h2><div class="btncol" id="presets"></div></section>
<section><h2 data-i="params">Parameters</h2>
<label><span data-i="hue">Hue shift</span><input type="range" id="hue" min="0" max="1" step="0.01" value="0.47"></label>
<label><span data-i="speed">Speed</span><input type="range" id="speed" min="0" max="3" step="0.1" value="1"></label>
<label><span data-i="pause">Pause</span><button id="pause" data-i="pauseb">⏸</button></label></section>
<section><h2 data-i="glsl">GLSL source</h2><pre class="glsl" id="glsl"></pre></section>
</aside><div class="stage"><canvas id="cv"></canvas><div class="hint" data-i="hint">move mouse over the canvas</div></div></main>
<script src="app.js"></script></body></html>
